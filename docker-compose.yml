# Despliegue en Raspberry Pi (spec: ver deploy/README.md). Por defecto solo
# para acceso en red local, sin dominio ni HTTPS — el frontend (puerto 80) y
# el backend (puerto 3000) se exponen directos, sin proxy inverso entre
# medias. El servicio `cloudflared` de más abajo es opcional y añade acceso
# desde fuera de casa vía Cloudflare Tunnel (ver deploy/README.md §9) sin
# abrir puertos en el router.
#
# Copia .env.example a .env y rellena los valores antes de `docker compose
# up -d --build`.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: economia_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: economia_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U economia_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://economia_app:${POSTGRES_PASSWORD}@postgres:5432/economia_dev
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?falta JWT_ACCESS_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET en .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Cuenta de servicio para la importación desde Google Sheets (spec
      # 026) — opcional, igual que GOOGLE_CLIENT_ID/SECRET: sin rellenar,
      # el backend responde 503 de forma controlada en esos endpoints.
      GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SHEETS_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SHEETS_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      # `backend/src/config/env.validation.ts`: a diferencia de
      # GOOGLE_CLIENT_ID/SECRET, este campo no admite cadena vacía (solo
      # `.uri()`) — sin Google configurado da igual qué URL lleve (el
      # guard de Google ya bloquea con 503 antes de usarla), pero tiene
      # que ser sintácticamente válida. Mismo valor por defecto que el
      # propio esquema de validación.
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      # Exportar a Google Drive (spec 032 H4, deploy/README.md §10) —
      # opcional, mismo criterio que el resto de Google: vacío/sin rellenar
      # y el backend responde 503 de forma controlada en esas rutas.
      # GOOGLE_DRIVE_CALLBACK_URL tiene la misma exigencia de formato que
      # GOOGLE_CALLBACK_URL (URL sintácticamente válida aunque no se use).
      GOOGLE_DRIVE_CALLBACK_URL: ${GOOGLE_DRIVE_CALLBACK_URL:-http://localhost:3000/auth/drive/callback}
      DRIVE_TOKEN_ENCRYPTION_KEY: ${DRIVE_TOKEN_ENCRYPTION_KEY:-}
      # Reconocimiento de tickets por OCR (spec 034) — opcional, mismo
      # criterio que el resto de Google: vacío/sin rellenar y el backend
      # responde 503 de forma controlada en /receipt-import/preview.
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:-}
      # `.email()` de Joi valida el dominio contra una lista de TLD reales
      # — un dominio `.local`/`.internal` lo rechaza aunque el formato sea
      # correcto. `.dev` sí es un TLD real (mismo valor que
      # backend/.env.example).
      MAIL_FROM: ${MAIL_FROM:-no-reply@economia-app.dev}
      FRONTEND_URL: ${FRONTEND_URL:?falta FRONTEND_URL en .env}
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?falta VITE_API_BASE_URL en .env}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # Opcional (deploy/README.md §9): acceso desde fuera de casa sin abrir
  # puertos en el router. Solo arranca si CLOUDFLARE_TUNNEL_TOKEN tiene
  # valor — con .env sin rellenar, `docker compose up` sigue funcionando
  # igual que antes, solo en LAN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
      - backend
    profiles:
      - tunnel

volumes:
  postgres_data:
